<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino-Vault: The Evolution Escape</title>

<style>

:root{
    --neon:#00ff41;
    --danger:#ff3131;
    --accent:#ffd700;
}

body,html{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:'Courier New', monospace;
    color:var(--neon);
}

/* BACKGROUND */
.bg-overlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    z-index:-5;
}

/* DOORS */
#door-left,#door-right{
    position:fixed;
    top:0;
    width:50%;
    height:100%;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
    background:linear-gradient(90deg,#111,#333);
    transition:transform 1.8s;
}

#door-left{left:0;}
#door-right{right:0;}

.doors-open #door-left{transform:translateX(-100%);}
.doors-open #door-right{transform:translateX(100%);}

/* INTRO */
#intro-screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:black;
    z-index:1001;
}

button{
    padding:15px 30px;
    font-size:1.2rem;
    background:var(--neon);
    border:none;
    cursor:pointer;
}

/* GAME */
#game-container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

#main-display{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

#question-grid{
    display:grid;
    grid-template-columns:repeat(2,200px);
    gap:10px;
    margin-bottom:20px;
}

.question-card{
    border:1px solid var(--neon);
    padding:10px;
    cursor:pointer;
}

.question-card.completed{
    background:var(--neon);
    color:black;
}

/* FINAL SCENE */
#final-scene{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    z-index:5000;
}

.final-dino{
    position:absolute;
    font-size:4rem;
    animation:walk 10s linear infinite;
}

@keyframes walk{
    from{transform:translateX(-100vw);}
    to{transform:translateX(120vw);}
}

.firework{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    animation:boom 1.5s forwards;
}

@keyframes boom{
    from{transform:scale(0);opacity:1;}
    to{transform:scale(15);opacity:0;}
}

</style>
</head>

<body class="doors-open">

<div class="bg-overlay"></div>

<div id="door-left">SECURITY</div>
<div id="door-right">LOCKED</div>

<div id="intro-screen">
    <h1>DINOSAUR VAULT</h1>
    <button onclick="beginGame()">START</button>
</div>

<div id="game-container">

    <div id="main-display">

        <div id="status-line">DOOR 1</div>

        <div id="question-grid"></div>

        <div id="q-text">Select a challenge</div>

        <input id="user-input" placeholder="answer">

        <p id="feedback"></p>
        <p id="hint-box"></p>

    </div>

</div>

<div id="final-scene">
    <h1 style="color:white;">YOU ESCAPED!</h1>
    <div class="final-dino">🦖</div>
    <div class="final-dino">🦕</div>
</div>

<script>

/* GAME DATA */
const gameData = [{
    questions:[
        {q:"Law of ____ (older fossils deeper)", a:"superposition", hint:"super..."},
        {q:"Index ____ fossils", a:"index", hint:"used for dating"},
        {q:"Soft tissue in fossils? yes/no", a:"no", hint:"rare"},
        {q:"Scientist of fossils", a:"paleontologist", hint:"digging"}
    ]
}];

let zoneIdx=0;
let currentQuestion=null;
let solved=[];

/* START */
function beginGame(){
    document.getElementById("intro-screen").style.display="none";
    updateUI();
}

/* UI */
function updateUI(){
    const grid=document.getElementById("question-grid");
    grid.innerHTML="";

    gameData[zoneIdx].questions.forEach((q,i)=>{
        const d=document.createElement("div");
        d.className="question-card";
        d.innerText="Q"+(i+1);

        d.onclick=()=>{
            currentQuestion=i;
            document.getElementById("q-text").innerText=q.q;
        };

        if(solved.includes(i)) d.classList.add("completed");

        grid.appendChild(d);
    });
}

/* CHECK */
document.getElementById("user-input").addEventListener("keydown",e=>{
if(e.key==="Enter"&&currentQuestion!==null){

    let q=gameData[zoneIdx].questions[currentQuestion];
    let ans=e.target.value.toLowerCase();

    if(ans===q.a){
        solved.push(currentQuestion);
        document.getElementById("feedback").innerText="✓ correct";

        if(solved.length===4){
            openDoor();
        }else{
            updateUI();
        }

    }else{
        document.getElementById("feedback").innerText="× wrong";
    }

}
});

/* DOOR */
function openDoor(){

    document.body.classList.remove("doors-open");

    setTimeout(()=>{

        document.body.classList.add("doors-open");

        if(zoneIdx>=gameData.length-1){

            document.getElementById("game-container").style.display="none";
            document.getElementById("final-scene").style.display="flex";

            launchFireworks();

        }

    },2000);
}

/* FIREWORKS */
function launchFireworks(){

    for(let i=0;i<30;i++){

        let f=document.createElement("div");
        f.className="firework";
        f.style.left=Math.random()*100+"vw";
        f.style.top=Math.random()*100+"vh";

        document.getElementById("final-scene").appendChild(f);

        setTimeout(()=>f.remove(),1500);
    }

    setInterval(launchFireworks,2000);
}

</script>

</body>
</html>
