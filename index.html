<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Lazarus Protocol | Advanced Evolution Escape</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff3131; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* The "Shake" Animation for wrong answers */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); border-color: var(--danger); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .error-shake { animation: shake 0.4s; }

        #terminal {
            width: 90%; max-width: 700px; border: 2px solid var(--neon); padding: 40px;
            background: linear-gradient(180deg, rgba(0,255,65,0.05) 0%, rgba(0,0,0,1) 100%);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }

        .progress-bar { width: 100%; height: 10px; background: #222; margin-bottom: 20px; }
        #progress-fill { width: 0%; height: 100%; background: var(--neon); transition: width 0.5s; }

        input { background: transparent; border: none; border-bottom: 2px solid var(--neon); 
                color: var(--neon); width: 100%; font-size: 1.5rem; outline: none; margin-top: 20px; }
        
        .fade-in { animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="terminal">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div id="game-content" class="fade-in">
        </div>
    <input type="text" id="user-input" autocomplete="off" style="display:none;">
    <p id="feedback" style="color: var(--danger); margin-top: 10px;"></p>
</div>

<script>
    // ROOM DATA: Add as many questions as you want here!
    const rooms = [
        {
            title: "ROOM 1: THE FOSSIL VAULT",
            questions: [
                { q: "Data Trace Found: A fossil in the deepest rock layer is generally ____ than one near the surface. (older/younger)", a: "older" },
                { q: "Which law states that younger rocks sit on top of older rocks?", a: "superposition" },
                { q: "What do we call fossils used to define and identify geologic periods?", a: "index fossils" }
            ]
        },
        {
            title: "ROOM 2: EMBRYOLOGY LAB",
            questions: [
                { q: "True or False: Human embryos have 'gill slits' early in development.", a: "true" },
                { q: "Shared embryonic stages suggest a common _____.", a: "ancestor" }
            ]
        }
    ];

    let currentRoom = 0;
    let currentQuestion = 0;

    const contentDiv = document.getElementById('game-content');
    const inputField = document.getElementById('user-input');
    const feedback = document.getElementById('feedback');
    const progress = document.getElementById('progress-fill');

    function loadQuestion() {
        const room = rooms[currentRoom];
        const question = room.questions[currentQuestion];
        
        contentDiv.innerHTML = `
            <h2>${room.title}</h2>
            <p>Question ${currentQuestion + 1} of ${room.questions.length}</p>
            <hr>
            <p style="font-size: 1.2rem;">${question.q}</p>
        `;
        inputField.value = "";
        inputField.style.display = "block";
        inputField.focus();
    }

    inputField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const answer = inputField.value.trim().toLowerCase();
            const correctAnswer = rooms[currentRoom].questions[currentQuestion].a.toLowerCase();

            if (answer === correctAnswer) {
                currentQuestion++;
                feedback.innerText = "";
                
                if (currentQuestion >= rooms[currentRoom].questions.length) {
                    currentRoom++;
                    currentQuestion = 0;
                    if (currentRoom >= rooms.length) {
                        winGame();
                        return;
                    }
                }
                updateProgress();
                loadQuestion();
            } else {
                // Trigger the Shake Animation
                document.getElementById('terminal').classList.add('error-shake');
                feedback.innerText = "!! ACCESS DENIED: INCORRECT DATA !!";
                setTimeout(() => {
                    document.getElementById('terminal').classList.remove('error-shake');
                }, 4000);
            }
        }
    });

    function updateProgress() {
        const total = rooms.length;
        const perc = (currentRoom / total) * 100;
        progress.style.width = perc + "%";
    }

    function winGame() {
        progress.style.width = "100%";
        contentDiv.innerHTML = "<h2>SYSTEM OVERRIDE SUCCESSFUL</h2><p>You have secured the DNA. Evolution verified.</p>";
        inputField.style.display = "none";
    }

    // Start the game
    loadQuestion();
</script>

</body>
</html>
