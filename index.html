<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dino-Vault: Evolution Escape</title>

<style>

:root{
    --neon:#00ff41;
    --danger:#ff3131;
    --accent:#ffd700;
    --bg:#050505;
}

body,html{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Courier New', monospace;
    background:black;
    color:var(--neon);
}

/* ===========================
   BACKGROUND DINOS
=========================== */

.bg-overlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.9)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    background-position:center;
    z-index:-5;
}

.dino{
    position:absolute;
    opacity:0.08;
    font-size:7rem;
    animation:float 25s linear infinite;
    z-index:-4;
}

.dino:nth-child(1){top:10%;left:-10%;}
.dino:nth-child(2){top:60%;left:-20%;}

@keyframes float{
    from{transform:translateX(0);}
    to{transform:translateX(130vw);}
}

/* ===========================
   DOORS
=========================== */

#door-left,#door-right{
    position:fixed;
    top:0;
    width:50%;
    height:100%;
    background:linear-gradient(90deg,#111,#333);
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
    transition:1.8s;
}

#door-left{left:0;}
#door-right{right:0;}

.doors-open #door-left{transform:translateX(-100%);}
.doors-open #door-right{transform:translateX(100%);}

/* ===========================
   INTRO
=========================== */

#intro{
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
        url('https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:2000;
}

#intro h1{
    font-size:4rem;
    color:var(--accent);
}

/* ===========================
   GAME AREA
=========================== */

#game{
    display:flex;
    flex-direction:column;
    height:100vh;
}

#header{
    padding:15px;
    border-bottom:2px solid var(--neon);
    background:rgba(0,0,0,0.8);
}

#zone-selector{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:10px;
}

.zone-btn{
    padding:10px 15px;
    border:2px solid var(--accent);
    cursor:pointer;
    transition:0.3s;
}

.zone-btn.active{
    background:var(--accent);
    color:black;
}

.zone-btn.complete{
    background:var(--neon);
    color:black;
}

#question-grid{
    display:grid;
    grid-template-columns:repeat(2,200px);
    gap:15px;
    justify-content:center;
    margin-top:20px;
}

.question-card{
    border:2px solid var(--neon);
    padding:15px;
    cursor:pointer;
    text-align:center;
}

.question-card.completed{
    background:var(--neon);
    color:black;
}

.question-card.active{
    border-color:var(--accent);
}

/* ===========================
   MAIN
=========================== */

#main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

input{
    background:transparent;
    border:none;
    border-bottom:2px solid var(--neon);
    color:var(--neon);
    font-size:2rem;
    text-align:center;
    outline:none;
    width:300px;
}

#hint{
    margin-top:10px;
    color:var(--accent);
    opacity:0;
    transition:1s;
}

#hint.show{opacity:1;}

.shake{
    animation:shake 0.3s;
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-10px);}
    75%{transform:translateX(10px);}
}

/* ===========================
   FINAL SCENE
=========================== */

#final{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:
        linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    z-index:5000;
    color:white;
}

.firework{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    animation:boom 1.5s ease-out forwards;
}

@keyframes boom{
    0%{transform:scale(0);opacity:1;}
    100%{transform:scale(20);opacity:0;}
}

.final-dino{
    position:absolute;
    font-size:5rem;
    animation:walk 20s linear infinite;
}

@keyframes walk{
    from{transform:translateX(-10%);}
    to{transform:translateX(120vw);}
}

</style>
</head>

<body>

<div class="bg-overlay"></div>

<div class="dino">🦖</div>
<div class="dino">🦕</div>

<div id="door-left">SECURITY</div>
<div id="door-right">LOCKED</div>

<div id="intro">
    <h1>DINO VAULT</h1>
    <button onclick="startGame()">START</button>
</div>

<div id="game">

<div id="header">
    <div id="zone-selector"></div>
</div>

<div id="main">

    <div id="question-grid"></div>

    <div id="qtext">Select a zone</div>

    <input id="input" placeholder="answer">

    <div id="hint"></div>

</div>

</div>

<div id="final">
    <h1>YOU ESCAPED!</h1>
    <div class="final-dino">🦖</div>
    <div class="final-dino">🦕</div>
</div>

<script>

/* ===========================
   DATA
=========================== */

const data = [

{
zone:"FOSSILS",
questions:[
{q:"Law of ____",a:"superposition",hint:"layers"},
{q:"Index fossils",a:"index",hint:"dating"},
{q:"Soft tissue? (yes/no)",a:"no",hint:"rare"},
{q:"Scientist",a:"paleontologist",hint:"fossils"}
]
},

{
zone:"ANATOMY",
questions:[
{q:"Homologous",a:"homologous",hint:"common ancestor"},
{q:"Analogous",a:"analogous",hint:"similar function"},
{q:"Tailbone",a:"vestigial",hint:"unused"},
{q:"Common ancestor? (yes/no)",a:"yes",hint:"evolution"}
]
},

{
zone:"EMBRYO",
questions:[
{q:"Gill slits",a:"gill",hint:"fish"},
{q:"Tail in embryo",a:"true",hint:"temporary"},
{q:"Shared ancestor",a:"ancestor",hint:"origin"},
{q:"Development",a:"development",hint:"growth"}
]
},

{
zone:"SELECTION",
questions:[
{q:"Survival of the ____",a:"fittest",hint:"darwin"},
{q:"Adaptation",a:"adaptation",hint:"trait"},
{q:"Selection pressure",a:"environment",hint:"nature"},
{q:"Variation",a:"variation",hint:"differences"}
]
}

];

let zone=0;
let current=null;
let solved=[[],[],[],[]];
let timer;

/* ===========================
   INIT
=========================== */

function startGame(){
document.getElementById('intro').style.display='none';
render();
}

/* ===========================
   RENDER
=========================== */

function render(){

const zones=document.getElementById('zone-selector');
const grid=document.getElementById('question-grid');

zones.innerHTML="";
grid.innerHTML="";

const roman=["I","II","III","IV"];

data.forEach((z,i)=>{

const b=document.createElement('div');
b.className="zone-btn";
b.innerText="ZONE "+roman[i];

if(i===zone)b.classList.add("active");
if(solved[i].length===4)b.classList.add("complete");

b.onclick=()=>{zone=i;current=null;render();};

zones.appendChild(b);

});

data[zone].questions.forEach((q,i)=>{

const c=document.createElement('div');
c.className="question-card";

if(solved[zone].includes(i)){
c.classList.add("completed");
c.innerText="✓";
}else{
c.innerText="Q "+["I","II","III","IV"][i];
}

if(current===i)c.classList.add("active");

c.onclick=()=>{
if(solved[zone].includes(i))return;
current=i;
document.getElementById('qtext').innerText=q.q;
startHint(q.hint);
};

grid.appendChild(c);

});

}

/* ===========================
   HINT
=========================== */

function startHint(h){

clearTimeout(timer);
document.getElementById('hint').classList.remove('show');

timer=setTimeout(()=>{

document.getElementById('hint').innerText="🦖 "+h;
document.getElementById('hint').classList.add('show');

},15000);

}

/* ===========================
   INPUT
=========================== */

document.getElementById('input').addEventListener('keypress',e=>{

if(e.key!=="Enter"||current===null)return;

const ans=e.target.value.toLowerCase();
const correct=data[zone].questions[current].a;

if(ans===correct){

solved[zone].push(current);
current=null;
e.target.value="";
document.getElementById('qtext').innerText="Select next";
render();

checkWin();

}else{

document.getElementById('main').classList.add('shake');

setTimeout(()=>document.getElementById('main').classList.remove('shake'),300);

}

});

/* ===========================
   WIN CHECK
=========================== */

function checkWin(){

let total=0;
solved.forEach(z=>total+=z.length);

if(total===16){

document.body.classList.remove("doors-open");

setTimeout(()=>{

document.getElementById('final').style.display="flex";
fireworks();

},1500);

}

}

/* ===========================
   FIREWORKS
=========================== */

function fireworks(){

for(let i=0;i<40;i++){

let f=document.createElement("div");
f.className="firework";
f.style.left=Math.random()*100+"vw";
f.style.top=Math.random()*80+"vh";
f.style.background=`hsl(${Math.random()*360},100%,60%)`;

document.getElementById("final").appendChild(f);

setTimeout(()=>f.remove(),1500);

}

setInterval(fireworks,2000);

}

render();

</script>

</body>
</html>
