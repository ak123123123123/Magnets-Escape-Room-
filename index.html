<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino-Vault: The Evolution Escape</title>

<style>
:root{
    --neon:#00ff41;
    --danger:#ff3131;
    --bg:#050505;
    --accent:#ffd700;
}

body,html{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:black;
    font-family:'Courier New', monospace; color:var(--neon);
}

/* ===========================
   BACKGROUND & DOORS
=========================== */
.bg-overlay{
    position:fixed; inset:0;
    background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
                url('https://images.unsplash.com/photo-1550355191-aa8a80b403e8?auto=format&fit=crop&w=1400&q=80');
    background-size:cover; background-position:center; z-index:-5;
}

#door-left, #door-right{
    position:fixed; top:0; width:50%; height:100%; z-index:1000;
    display:flex; justify-content:center; align-items:center;
    font-size:3rem; color:#666; background:linear-gradient(90deg,#111,#333);
    transition:transform 1.8s cubic-bezier(0.7,0,0.3,1);
}
#door-left{ left:0; border-right:3px solid var(--neon); }
#door-right{ right:0; border-left:3px solid var(--neon); }

.doors-open #door-left{ transform:translateX(-100%); }
.doors-open #door-right{ transform:translateX(100%); }

/* ===========================
   INTERFACE & PROGRESSION
=========================== */
#game-container{ display:flex; flex-direction:column; width:100vw; height:100vh; border:4px solid var(--neon); box-sizing:border-box; }
#header{ padding:20px; border-bottom:2px solid var(--neon); background:rgba(0,0,0,0.85); }
#map{ display:flex; justify-content:space-around; margin-top:10px; }

.map-zone{ 
    padding:6px 14px; border:1px solid var(--neon); font-size:0.8rem; 
    cursor: pointer; opacity:0.4; transition: 0.3s;
}
.map-zone.active{ opacity:1; background:rgba(0,255,65,0.2); box-shadow:0 0 10px var(--neon); }
.map-zone.cleared{ background:var(--neon); color:black; opacity:1; }

#main-display{ flex-grow:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:40px; }

/* LOCK PROGRESSION STYLES */
#lock-visualizer {
    font-size: 1.2rem;
    margin-bottom: 10px;
    letter-spacing: 5px;
    color: var(--accent);
}

#question-grid{ display:grid; grid-template-columns:repeat(2, 220px); gap:20px; margin-bottom:30px; }
.question-card{ 
    border: 2px solid var(--neon); padding: 25px; cursor: pointer; 
    background: rgba(0,255,65,0.05); text-align: center;
    transition: 0.3s;
}
.question-card.completed{ 
    border-color: var(--neon); 
    background: rgba(0,255,65,0.4); 
    color: white; 
    text-shadow: 0 0 10px var(--neon);
}
.question-card.active{ border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }

input{ background:transparent; border:none; border-bottom:2px solid var(--neon); color:var(--neon); font-family:inherit; font-size:2rem; text-align:center; width:450px; outline:none; }

/* VIDEO OVERLAY */
#video-cutscene {
    position: fixed; inset: 0; z-index: 2000;
    background: black; display: none;
    justify-content: center; align-items: center;
}
#cutscene-player { width: 100%; height: 100%; object-fit: cover; }

#intro-screen{
    position:absolute; inset:0; z-index:1001;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                url('https://images.unsplash.com/photo-1525877442103-5ddb2089e2bb?auto=format&fit=crop&w=1400&q=80');
    background-size:cover; background-position:center;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:40px;
}
button{ margin-top:20px; padding:18px 40px; font-size:1.2rem; font-weight:bold; cursor:pointer; background:var(--neon); border:none; }
</style>
</head>

<body class="doors-open">

<div class="bg-overlay"></div>
<div id="door-left">VAULT</div>
<div id="door-right">LOCKING</div>

<div id="video-cutscene">
    <video id="cutscene-player">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
</div>

<div id="intro-screen">
    <h1>THE DINOSAUR VAULT</h1>
    <p>Verify all four Roman blocks (I-IV) in every zone to seal the facility.</p>
    <button onclick="beginGame()">INITIALIZE SYSTEM</button>
</div>

<div id="game-container">
    <div id="header">
        <div id="map">
            <div class="map-zone" onclick="switchZone(0)" id="zone-0">ZONE I: FOSSILS</div>
            <div class="map-zone" onclick="switchZone(1)" id="zone-1">ZONE II: ANATOMY</div>
            <div class="map-zone" onclick="switchZone(2)" id="zone-2">ZONE III: EMBRYOS</div>
            <div class="map-zone" onclick="switchZone(3)" id="zone-3">ZONE IV: SELECTION</div>
        </div>
    </div>

    <div id="main-display">
        <div id="lock-visualizer">VAULT STATUS: [ 🔓 🔓 🔓 🔓 ]</div>
        
        <div id="question-grid"></div>
        <div id="q-text" style="font-size: 1.4rem; margin-bottom: 20px; max-width: 80%; min-height: 60px;">Select a block to verify...</div>
        <input type="text" id="user-input" autocomplete="off" placeholder="ENTER CODE">
        <p id="feedback" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
</div>

<script>
const gameData = [
    { zone:"FOSSILS", questions:[
        { q:"Older fossils are in deeper rock layers. This is the law of ____.", a:"superposition" },
        { q:"Fossils used to date the rock layer they're in: ____ fossils.", a:"index" },
        { q:"Can soft tissue usually be found in fossils? (yes/no)", a:"no" },
        { q:"Study of fossils is called ____.", a:"paleontology" }
    ]},
    { zone:"ANATOMY", questions:[
        { q:"Same structure, different use: ____ structures.", a:"homologous" },
        { q:"Similar use, different structure: ____ structures.", a:"analogous" },
        { q:"Leftover body parts like human tailbones are ____.", a:"vestigial" },
        { q:"Do homologous structures prove common ancestry? (yes/no)", a:"yes" }
    ]},
    { zone:"EMBRYOLOGY", questions:[
        { q:"Vertebrate embryos have ____ slits early on.", a:"gill" },
        { q:"Vertebrates look similar during early ____ development.", a:"embryo" },
        { q:"Similar embryos suggest a more ____ ancestor.", a:"recent" },
        { q:"Embryology proves all vertebrates are ____.", a:"connected" }
    ]},
    { zone:"SELECTION", questions:[
        { q:"Nature chooses traits for survival. This is ____ selection.", a:"natural" },
        { q:"Trait that helps an organism survive is an ____.", a:"adaptation" },
        { q:"Survival of the ____.", a:"fittest" },
        { q:"Scientist famous for the theory of evolution?", a:"darwin" }
    ]}
];

const roman = ["I", "II", "III", "IV"];
let activeZoneIdx = 0;
let activeQIdx = null;
let globalSolved = { 0: [], 1: [], 2: [], 3: [] };

function beginGame(){
    document.getElementById('intro-screen').style.display = 'none';
    switchZone(0);
}

function switchZone(idx) {
    activeZoneIdx = idx;
    activeQIdx = null;
    document.getElementById('q-text').innerText = "Accessing Zone " + roman[idx] + "... Select a block.";
    updateUI();
}

function updateUI(){
    // Map Update
    document.querySelectorAll('.map-zone').forEach((z, i) => {
        z.className = 'map-zone';
        if (globalSolved[i].length >= 4) z.classList.add('cleared');
        if (i === activeZoneIdx) z.classList.add('active');
    });

    // Lock Visualizer Progression
    let solvedInZone = globalSolved[activeZoneIdx].length;
    let lockString = "VAULT STATUS: [ ";
    for(let i=0; i<4; i++) {
        lockString += (i < solvedInZone) ? "🔒 " : "🔓 ";
    }
    lockString += "]";
    document.getElementById('lock-visualizer').innerText = lockString;
    document.getElementById('lock-visualizer').style.color = (solvedInZone === 4) ? "var(--neon)" : "var(--accent)";

    // Grid Update
    const grid = document.getElementById('question-grid');
    grid.innerHTML = "";
    gameData[activeZoneIdx].questions.forEach((q, index) => {
        const card = document.createElement('div');
        const isSolved = globalSolved[activeZoneIdx].includes(index);
        card.className = 'question-card' + (isSolved ? ' completed' : '');
        if (activeQIdx === index) card.classList.add('active');
        
        card.innerText = isSolved ? `SECURED ${roman[index]}` : `BLOCK ${roman[index]}`;
        
        card.onclick = () => {
            if(isSolved) return;
            activeQIdx = index;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('user-input').value = "";
            document.getElementById('user-input').focus();
            updateUI();
        };
        grid.appendChild(card);
    });
}

document.getElementById('user-input').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') {
        if (activeQIdx === null) return;
        const correct = gameData[activeZoneIdx].questions[activeQIdx].a;
        const user = document.getElementById('user-input').value.trim().toLowerCase();

        if (user === correct) {
            globalSolved[activeZoneIdx].push(activeQIdx);
            activeQIdx = null;
            document.getElementById('user-input').value = "";
            document.getElementById('feedback').innerText = "✓ VERIFIED";
            document.getElementById('feedback').style.color = "var(--neon)";
            updateUI();
            checkVictory();
        } else {
            document.getElementById('feedback').innerText = "× DENIED";
            document.getElementById('feedback').style.color = "var(--danger)";
        }
    }
});

function checkVictory() {
    const totalSolved = Object.values(globalSolved).flat().length;
    if (totalSolved === 16) {
        document.body.classList.remove('doors-open');
        setTimeout(() => {
            const videoContainer = document.getElementById('video-cutscene');
            const player = document.getElementById('cutscene-player');
            videoContainer.style.display = 'flex';
            player.play();

            player.onended = () => {
                videoContainer.style.display = 'none';
                document.getElementById('main-display').innerHTML = "<h1>CONTAINMENT SECURED</h1><p>Mission Successful.</p><button onclick='location.reload()'>RESTART</button>";
                document.body.classList.add('doors-open');
            };
        }, 1800);
    }
}
</script>
</body>
</html>
